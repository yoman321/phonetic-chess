server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any non-asset path falls back to index.html so
    # React Router can take over client-side.
    location / {
        try_files $uri /index.html;
    }

    # REST API: strip the /api prefix before forwarding to the backend.
    # The trailing slash on proxy_pass is what does the stripping.
    location /api/ {
        proxy_pass http://backend:5001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket upgrade for Flask-SocketIO. Path is fixed at /socket.io/.
    location /socket.io/ {
        proxy_pass http://backend:5001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
