<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1626"/>
      <stop offset="1" stop-color="#0b0a10"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b15cff"/>
      <stop offset="1" stop-color="#7e14ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8a3bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8a3bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="heading" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="600" cy="150" r="430" fill="url(#glow)"/>

  <!-- knight in a speech bubble, centered -->
  <g transform="translate(536,40) scale(2)">
    <path fill="url(#logo)" d="M18 4h28a12 12 0 0 1 12 12v20a12 12 0 0 1-12 12H24l-12 12 4-12h-0a12 12 0 0 1-12-12V16A12 12 0 0 1 18 4z"/>
    <g transform="translate(14,6.5) scale(0.8)" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path fill="#fff" d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18"/>
      <path fill="#fff" d="M 24,18 C 24.38,20.91 18.45,25.37 16,27 C 13,29 13.18,31.34 11,31 C 9.958,30.06 12.41,27.96 11,28 C 10,28 11.19,29.23 10,30 C 9,30 5.997,31 6,26 C 6,24 12,14 12,14 C 12,14 13.89,12.1 14,10.5 C 13.27,9.506 13.5,8.5 13.5,7.5 C 14.5,6.5 16.5,10 16.5,10 L 18.5,10 C 18.5,10 19.28,8.008 21,7 C 22,7 22,10 22,10"/>
      <path fill="#000" stroke="#000" d="M 9.5 25.5 A 0.5 0.5 0 1 1 8.5,25.5 A 0.5 0.5 0 1 1 9.5 25.5 z"/>
      <path fill="#000" stroke="#000" transform="matrix(0.866,0.5,-0.5,0.866,9.693,-5.173)" d="M 15 15.5 A 0.5 1.5 0 1 1  14,15.5 A 0.5 1.5 0 1 1  15 15.5 z"/>
    </g>
  </g>

  <text x="600" y="214" text-anchor="middle" font-size="30" font-weight="700" fill="#d9ccff" letter-spacing="6">PHONETIC CHESS</text>

  <!-- headline -->
  <text x="600" y="312" text-anchor="middle" font-size="72" font-weight="800" fill="url(#heading)">Type the mood.</text>
  <text x="600" y="394" text-anchor="middle" font-size="72" font-weight="800" fill="url(#heading)">An LLM plays <tspan fill="#b15cff">the move.</tspan></text>

  <!-- subline -->
  <text x="600" y="452" text-anchor="middle" font-size="28" font-weight="400" fill="#a79fb8">A two-player web chess game where your phrasing picks the play.</text>

  <!-- tone chips, centered as a row: happy / neutral / angry -->
  <g transform="translate(244,498)" font-size="24" font-weight="600">
    <g transform="translate(0,0)">
      <rect width="196" height="48" rx="24" fill="rgba(61,220,151,0.12)" stroke="rgba(61,220,151,0.55)" stroke-width="1.5"/>
      <text x="98" y="31" text-anchor="middle" fill="#c7f5e1">&#8220;sounds great!&#8221;</text>
    </g>
    <g transform="translate(214,0)">
      <rect width="236" height="48" rx="24" fill="rgba(177,92,255,0.12)" stroke="rgba(177,92,255,0.55)" stroke-width="1.5"/>
      <text x="118" y="31" text-anchor="middle" fill="#e4d6ff">&#8220;okay, that works&#8221;</text>
    </g>
    <g transform="translate(468,0)">
      <rect width="244" height="48" rx="24" fill="rgba(255,92,92,0.12)" stroke="rgba(255,92,92,0.55)" stroke-width="1.5"/>
      <text x="122" y="31" text-anchor="middle" fill="#ffd2d2">&#8220;per my last email&#8221;</text>
    </g>
  </g>

  <text x="600" y="598" text-anchor="middle" font-size="22" font-weight="600" fill="#8a8299" letter-spacing="0.5">phoneticchess.duckdns.org</text>
</svg>
